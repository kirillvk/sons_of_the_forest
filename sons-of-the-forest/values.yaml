# Default values for sons-of-the-forest.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image, see: https://hub.docker.com/r/jammsen/sons-of-the-forest-dedicated-server
image:
  repository: jammsen/sons-of-the-forest-dedicated-server
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# NOTE: The container's entrypoint must start as root (it chowns the game/wine
# data directories and then de-escalates to PUID/PGID via gosu). Do not set
# runAsNonRoot/runAsUser here, and don't run this chart under a restricted
# (non-root-permitting) Pod Security Standard.
podSecurityContext: {}
  # fsGroup: 1000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true

# Environment variables passed to the container, see:
# https://github.com/jammsen/docker-sons-of-the-forest-dedicated-server#docker-compose---example
env:
  PUID: "1000"
  PGID: "1000"
  TIMEZONE: "Europe/Berlin"
  ALWAYS_UPDATE_ON_START: "true"
  SKIP_NETWORK_ACCESSIBILITY_TEST: "true"
  FILTER_SHADER_AND_MESH_AND_WINE_DEBUG: "true"

# Additional arbitrary environment variables (list form, e.g. for Secret/ConfigMap refs).
extraEnv: []
# - name: FOO
#   value: "bar"

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # Game servers are usually exposed directly to players, e.g. via LoadBalancer.
  type: LoadBalancer
  # UDP ports used by the dedicated server, see:
  # https://github.com/jammsen/docker-sons-of-the-forest-dedicated-server
  ports:
    game: 8766
    query: 27016
    blobSync: 9700
  # Only used when service.type is LoadBalancer. Requests a specific IP from the
  # cloud/MetalLB provider instead of an auto-assigned one. Leave empty to auto-assign.
  loadBalancerIP: ""

# Run the pod in the host's network namespace instead of a pod IP, binding service.ports
# directly on the node. The SOTF client's LAN "Direct Connect" doesn't unicast its query to
# whatever IP you type in - for RFC1918 addresses it broadcasts to 255.255.255.255, which only
# an actual LAN host answers. A LoadBalancer/MetalLB VIP is a virtual address, not a real host on
# the broadcast domain, so it never sees that query and LAN clients get "Game server not found"
# even though the VIP is otherwise fully reachable (direct unicast, e.g. a WAN IP, works fine).
# hostNetwork avoids this by making the node's real LAN IP the thing clients connect to, same as
# running the upstream image directly with `docker run --network host`. When enabling this,
# service.type should usually be ClusterIP instead of LoadBalancer, since the ports are already
# exposed on the node and a MetalLB VIP would just reintroduce the same broadcast problem.
hostNetwork: false
# dnsPolicy for the pod. Only takes effect when hostNetwork is true (Kubernetes otherwise
# defaults appropriately on its own); "ClusterFirstWithHostNet" is required for in-cluster DNS
# (e.g. the setup initContainer, or coredns lookups) to keep working under hostNetwork.
dnsPolicy: ""

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # Minimum system requirements per upstream project: 2-4 CPU cores, 8GB+ RAM.
  # limits:
  #   cpu: "4"
  #   memory: 16Gi
  # requests:
  #   cpu: "2"
  #   memory: 8Gi

# Paths inside the container, matching the image's own GAME_PATH/GAME_USERDATA_PATH/
# GAME_CONFIGFILE_PATH defaults (see the Dockerfile in
# jammsen/docker-sons-of-the-forest-dedicated-server). These are also set as env vars on the
# container (below), so the persistent volume mount, the setup initContainer, and the running
# game server always agree on where things live - change gamePath here rather than overriding
# GAME_PATH via env/extraEnv directly.
paths:
  gamePath: /sonsoftheforest
  # Subdirectory of gamePath holding userdata (dedicatedserver.cfg, ownerswhitelist.txt, ...).
  userDataDir: userdata

# Persistent storage for the gameserver install, savegames and wine prefix (mounted at paths.gamePath).
persistence:
  enabled: true
  # Use an existing PersistentVolumeClaim instead of creating one.
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  annotations: {}

# The upstream image ships a Docker HEALTHCHECK based on `pgrep` for the game process;
# these probes mirror that same check for Kubernetes.
startupProbe:
  exec:
    command:
      - pgrep
      - -f
      - "[Z]:.*SonsOfTheForestDS.exe"
  # SteamCMD installing/updating the ~10GB+ server on first start can take a long time.
  periodSeconds: 30
  failureThreshold: 120
  timeoutSeconds: 10

livenessProbe:
  exec:
    command:
      - pgrep
      - -f
      - "[Z]:.*SonsOfTheForestDS.exe"
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  exec:
    command:
      - pgrep
      - -f
      - "[Z]:.*SonsOfTheForestDS.exe"
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Controls the initContainer(s) that perform one-off setup tasks, keeping the SOTF config files in
# sync from ConfigMaps instead of relying on the image to generate them on first install. Unlike a
# first-install-only seed, this re-syncs on every pod (re)start: if a file on the volume differs
# from what's rendered here, it gets OVERWRITTEN. So once enabled, manage these files via values
# only - don't hand-edit them in-game or directly on the volume, since the next restart will
# discard those changes.
setup:
  enabled: false
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent

  # Use an existing ConfigMap instead of templating one from serverConfig/ownerSteamIds below. Its
  # keys are mounted as files directly under paths.userDataDir, so it must contain
  # "dedicatedserver.cfg" and "ownerswhitelist.txt".
  existingUserDataConfigMap: ""

  # Use an existing ConfigMap instead of templating one from steamAppId below. Its keys are
  # mounted as files directly under paths.gamePath, so it must contain "steam_appid.txt".
  existingGameDirConfigMap: ""

  # Content of steam_appid.txt at the root of the game install (paths.gamePath). You shouldn't
  # need to change this - it's the Steamworks app id the bundled image ships in
  # https://github.com/jammsen/docker-sons-of-the-forest-dedicated-server/blob/master/configs/steam_appid.txt
  steamAppId: "1326470"

  # Rendered to userdata/dedicatedserver.cfg (JSON). IpAddress/GamePort/QueryPort/BlobSyncPort are
  # always taken from service.ports (above) and cannot be overridden here. ServerName defaults to
  # the release's fullname when left empty. Override individual keys via --set or a values file,
  # e.g. --set setup.serverConfig.MaxPlayers=10
  # See: https://github.com/jammsen/docker-sons-of-the-forest-dedicated-server/blob/master/configs/dedicatedserver.cfg.example
  serverConfig:
    ServerName: ""
    MaxPlayers: 8
    Password: ""
    LanOnly: false
    SaveSlot: 1
    SaveMode: "Continue"
    GameMode: "Normal"
    SaveInterval: 600
    IdleDayCycleSpeed: 0.0
    IdleTargetFramerate: 5
    ActiveTargetFramerate: 60
    LogFilesEnabled: false
    TimestampLogFilenames: true
    TimestampLogEntries: true
    SkipNetworkAccessibilityTest: true
    GameSettings: {}
    CustomGameModeSettings: {}

  # Rendered to userdata/ownerswhitelist.txt: SteamIDs allowed to administrate the server in-game.
  # See: https://github.com/jammsen/docker-sons-of-the-forest-dedicated-server/blob/master/configs/ownerswhitelist.txt.example
  ownerSteamIds: []
  # - "76561198000000000"
