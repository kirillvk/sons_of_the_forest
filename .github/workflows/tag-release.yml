name: Tag Release

# Calculates the next semantic version for the chart from conventional-commit
# messages (fix:, feat:, "BREAKING CHANGE") and pushes it as a git tag.
on:
  push:
    branches:
      - main
    paths:
      - "sons-of-the-forest/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      # A tag pushed using the default GITHUB_TOKEN does not trigger other workflows'
      # `on: push` events (GitHub suppresses that to avoid recursive runs), so
      # publish-chart.yml would never fire on its own. workflow_dispatch is exempt from
      # that suppression, so dispatch it explicitly instead of relying on the tag push.
      - name: Trigger chart publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-chart.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="${{ steps.tag_version.outputs.new_tag }}"

      - name: Summary
        run: |
          echo "### Tagged \`${{ steps.tag_version.outputs.new_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tag_version.outputs.changelog }}" >> "$GITHUB_STEP_SUMMARY"
