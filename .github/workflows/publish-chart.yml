name: Publish Chart

# Packages and publishes the Helm chart to GHCR as an OCI artifact whenever a
# semver tag (as pushed by tag-release.yml) lands on the repo. The chart
# version baked into the *published* package is taken from the tag, so it
# doesn't need to match whatever is committed in Chart.yaml on that commit.
on:
  push:
    tags:
      - "v*.*.*"
  # Allows manually (re-)publishing an existing tag, e.g.:
  #   gh workflow run publish-chart.yml --ref v0.1.0
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_PATH: sons-of-the-forest

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive chart version from tag
        id: version
        run: |
          # Strip the leading "v" from a tag like v1.2.3 -> 1.2.3
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Package chart with tag as version
        run: |
          mkdir -p .dist
          helm package "${{ env.CHART_PATH }}" \
            --version "${{ steps.version.outputs.version }}" \
            --destination .dist

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to GHCR
        run: |
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          helm push \
            ".dist/${{ env.CHART_PATH }}-${{ steps.version.outputs.version }}.tgz" \
            "oci://ghcr.io/${owner_lower}/charts"

      - name: Summary
        run: |
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          echo "Published \`${{ env.CHART_PATH }}:${{ steps.version.outputs.version }}\` to \`oci://ghcr.io/${owner_lower}/charts\`" >> "$GITHUB_STEP_SUMMARY"
